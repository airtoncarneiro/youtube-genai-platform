[project]
name = "youtube-etl-genai"
version = "0.1.0"
description = "ETL de canais, videos e comentarios do Youtube e GenAI"
authors = [{ name = "Airton Carneiro", email = "airtoncarneiro@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests (>=2.34.2,<3.0.0)"
]

[project.scripts]
youtube-etl-genai = "youtube_etl_genai.main:main"
run = "youtube_etl_genai.main:run"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "databricks-connect (==18.3.2)",
    "ipykernel (>=7.3.0,<8.0.0)",
    "databricks-sdk[notebook] (>=0.122.0,<0.123.0)",
    "pytest (>=8.0.0,<9.0.0)",
    "ruff (>=0.12.0,<0.13.0)"
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["notebooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
