resources:
  alerts:
    youtube_partial_success:
      display_name: "YouTube ingestion partial success"
      warehouse_id: ${var.dashboard_warehouse_id}
      query_text: |
        SELECT COUNT(*) AS partial_success_runs
        FROM ${var.catalog}.control.ingestion_runs
        WHERE status = 'PARTIAL_SUCCESS'
          AND ended_at >= current_timestamp() - INTERVAL 15 MINUTES
      evaluation:
        comparison_operator: GREATER_THAN
        source:
          name: partial_success_runs
          display: partial_success_runs
        threshold:
          value:
            double_value: 0
        notification:
          notify_on_ok: false
          subscriptions:
            - user_email: ${workspace.current_user.userName}
      schedule:
        pause_status: UNPAUSED
        quartz_cron_schedule: "0 */15 * * * ?"
        timezone_id: America/Sao_Paulo
